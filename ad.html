<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ドパ卒診断 広告</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── スマホフレーム ── */
    .phone-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      overflow: hidden;
      background: #000;
    }

    /* ── 背景映像風 ── */
    .bg-video {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 55% 55%, rgba(80,60,20,0.55) 0%, transparent 70%),
        radial-gradient(ellipse 40% 35% at 60% 62%, rgba(180,140,60,0.25) 0%, transparent 60%),
        linear-gradient(175deg, #050505 0%, #0a0808 30%, #111008 60%, #080808 100%);
      z-index: 0;
    }

    /* 暗闇でスマホを見る人のシルエット */
    .bg-figure {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 240px;
      background:
        radial-gradient(ellipse 70% 40% at 50% 75%, rgba(60,50,20,0.6) 0%, transparent 70%),
        radial-gradient(ellipse 30% 20% at 50% 80%, rgba(200,160,60,0.3) 0%, transparent 60%);
      z-index: 1;
    }

    /* スマホ画面の光源風 */
    .phone-glow {
      position: absolute;
      bottom: 33%;
      left: 44%;
      width: 100px;
      height: 80px;
      background: radial-gradient(ellipse, rgba(220,200,120,0.25) 0%, transparent 70%);
      border-radius: 8px;
      z-index: 2;
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ── TikTokっぽい枠線 ── */
    .tiktok-border {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(100,100,120,0.35);
      border-radius: 0;
      z-index: 50;
      pointer-events: none;
    }

    /* ── 右サイドバー ── */
    .sidebar {
      position: absolute;
      right: 10px;
      bottom: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    .sb-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    /* フォローボタン（＋アイコン付き円） */
    .follow-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .follow-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .follow-plus {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FE2C55;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .sb-icon {
      font-size: 28px;
      color: #fff;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
    }

    .sb-count {
      font-size: 11px;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      letter-spacing: .02em;
    }

    /* 音楽ディスク */
    .music-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #222, #444);
      border: 8px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinDisc 4s linear infinite;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
    }

    .music-disc::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #000;
      border: 2px solid #666;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── ボトムナビ ── */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 10;
      border-top: 0.5px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      cursor: pointer;
    }

    .nav-icon {
      font-size: 22px;
      color: #fff;
    }

    .nav-label {
      font-size: 9px;
      color: rgba(255,255,255,0.7);
    }

    .nav-plus {
      width: 46px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(90deg, #69C9D0 0%, #fff 45%, #EE1D52 55%, #EE1D52 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* ── メインコンテンツ ── */
    .content {
      position: absolute;
      inset: 0;
      bottom: 72px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 16px 24px;
      z-index: 5;
    }

    /* キャプション風テキスト（上部） */
    .caption-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 56px;
      padding: 52px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cap-line {
      display: inline-block;
      color: #5BE3FF;
      font-size: 15px;
      font-weight: 700;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 12px rgba(91,227,255,0.4);
      line-height: 1.5;
      animation: fadeInDown .6s ease both;
    }

    .cap-line:nth-child(1) { animation-delay: .1s; }
    .cap-line:nth-child(2) { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 400; animation-delay: .4s; }
    .cap-line:nth-child(3) { color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 400; animation-delay: .7s; }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* メインブランド部分 */
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      animation: fadeInUp .7s ease .8s both;
    }

    .brand-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .brand-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.0;
      text-align: center;
      color: #fff;
      letter-spacing: -0.02em;
      text-shadow:
        0 0 30px rgba(255,255,255,0.15),
        2px 2px 0 rgba(0,0,0,0.8),
        0 2px 16px rgba(0,0,0,0.9);
    }

    .brand-title .red {
      color: #E32B36;
      text-shadow:
        0 0 20px rgba(227,43,54,0.5),
        2px 2px 0 rgba(80,0,0,0.8),
        0 2px 16px rgba(0,0,0,0.9);
    }

    .brand-tagline {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* 神ドパ / なにドパ バッジ */
    .dopa-badges {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      animation: fadeInUp .7s ease 1.0s both;
    }

    .badge-left, .badge-right {
      font-weight: 900;
      text-shadow: 0 1px 8px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    .badge-left {
      font-size: 16px;
      color: #5BE3FF;
    }

    .badge-right {
      font-size: 16px;
      color: #fff;
      text-align: right;
    }

    .badge-right .emphasis {
      font-size: 20px;
    }

    /* 説明テキスト */
    .desc-text {
      font-size: 13px;
      color: rgba(255,255,255,0.9);
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.6;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      animation: fadeInUp .7s ease 1.1s both;
    }

    .desc-text .hl {
      color: #5BE3FF;
      font-weight: 700;
    }

    /* ── CTAボタン ── */
    .cta-btn {
      display: block;
      width: 100%;
      padding: 18px 0;
      border-radius: 50px;
      background: linear-gradient(135deg, #E32B36 0%, #c41e28 100%);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      letter-spacing: .06em;
      cursor: pointer;
      border: none;
      box-shadow:
        0 4px 24px rgba(227,43,54,0.6),
        0 2px 8px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.2);
      animation: fadeInUp .7s ease 1.2s both, btnPulse 2.5s ease-in-out 2s infinite;
      position: relative;
      overflow: hidden;
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
      border-radius: 50px;
    }

    .cta-btn:active {
      transform: scale(.97);
    }

    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(227,43,54,0.6), 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }
      50% { box-shadow: 0 4px 36px rgba(227,43,54,0.9), 0 2px 8px rgba(0,0,0,0.5), 0 0 0 6px rgba(227,43,54,0.15), inset 0 1px 0 rgba(255,255,255,0.2); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 広告ラベル */
    .ad-label {
      position: absolute;
      top: 10px;
      right: 66px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      padding: 2px 6px;
      border-radius: 3px;
      border: 0.5px solid rgba(255,255,255,0.2);
      z-index: 10;
    }

    /* 進捗バー（TikTok動画風） */
    .progress-bar {
      position: absolute;
      bottom: 72px;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.2);
      z-index: 10;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: rgba(255,255,255,0.8);
      border-radius: 1px;
    }

    /* スキップボタン */
    .skip-btn {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      padding: 4px 10px;
      border-radius: 4px;
      border: 0.5px solid rgba(255,255,255,0.15);
      z-index: 10;
      cursor: pointer;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone">

    <!-- 背景映像風 -->
    <div class="bg-video"></div>
    <div class="bg-figure"></div>
    <div class="phone-glow"></div>

    <!-- 広告ラベル -->
    <div class="ad-label">広告</div>

    <!-- スキップ -->
    <div class="skip-btn">スキップ ▶</div>

    <!-- TikTok枠 -->
    <div class="tiktok-border"></div>

    <!-- キャプション（上部） -->
    <div class="caption-top">
      <span class="cap-line">スクロール、もう3時間目。</span>
      <span class="cap-line">なんか虚しい...</span>
      <span class="cap-line">新しい趣味、始めたいけど<br>何が自分に合うかわからない...</span>
    </div>

    <!-- 右サイドバー -->
    <div class="sidebar">
      <div class="follow-wrap sb-item">
        <div class="follow-avatar">🎯</div>
        <div class="follow-plus">＋</div>
      </div>

      <div class="sb-item">
        <div class="sb-icon">♥</div>
        <div class="sb-count">500K</div>
      </div>

      <div class="sb-item">
        <div class="sb-icon">💬</div>
        <div class="sb-count">400</div>
      </div>

      <div class="sb-item">
        <div class="sb-icon">💬</div>
        <div class="sb-count">400</div>
      </div>

      <div class="sb-item">
        <div class="sb-icon" style="font-size:20px">↗</div>
        <div class="sb-count">Share</div>
      </div>

      <div class="sb-item">
        <div class="music-disc"></div>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="content">

      <!-- ブランド -->
      <div class="brand-block">
        <div class="brand-subtitle">あなたのスマホ依存度と<br>隠れた本音から導き出す</div>
        <div class="brand-title">ドパ卒<br><span class="red">診断</span></div>
        <div class="brand-tagline">〜スマホ依存から抜け出す処方箋〜</div>
      </div>

      <!-- 神ドパ / なにドパ -->
      <div class="dopa-badges">
        <div class="badge-left">神ドパ<br>かも...</div>
        <div class="badge-right">それとも<br><span class="emphasis">なにドパ？</span></div>
      </div>

      <!-- 説明 -->
      <div class="desc-text">
        28の質問で、<br>あなたに合った<span class="hl">趣味</span>と<span class="hl">抜け出し方</span>がわかる！
      </div>

      <!-- CTAボタン -->
      <a class="cta-btn" href="./index.html">診断する ⊙</a>

    </div>

    <!-- 進捗バー -->
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <!-- ボトムナビ -->
    <div class="bottom-nav">
      <div class="nav-item">
        <div class="nav-icon">🏠</div>
        <div class="nav-label">ホーム</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🔍</div>
        <div class="nav-label">検索</div>
      </div>
      <div class="nav-item">
        <div class="nav-plus">＋</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">✉️</div>
        <div class="nav-label">受信</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">👤</div>
        <div class="nav-label">マイページ</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
